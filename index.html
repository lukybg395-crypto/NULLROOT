<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NULLROOT | Cyber, Gaming & Tech Hub</title>
    <style>
        body {
            font-family: monospace, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #58a6ff;
        }
        nav a {
            color: #8b949e;
            text-decoration: none;
            margin-left: 15px;
        }
        nav a:hover {
            color: #3fb950;
        }
        .hero {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .hero h1 {
            color: #58a6ff;
            margin-top: 0;
            font-size: 1.8rem;
        }
        .section-title {
            color: #bc8cff;
            font-size: 1.2rem;
            margin: 30px 0 15px 0;
            border-left: 3px solid #bc8cff;
            padding-left: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
        }
        .card h3 {
            color: #ffffff;
            margin-top: 0;
        }
        .btn {
            display: inline-block;
            background: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            margin-top: 10px;
        }
        .btn:hover {
            background: #58a6ff;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">NULLROOT_</div>
            <nav>
                <a href="#cyber">Cyber</a>
                <a href="#gaming">Gaming</a>
                <a href="#raccourcis">Raccourcis</a>
            </nav>
        </header>

        <div class="hero">
            <h1>Documentation & Base de Connaissances</h1>

        </div>

        <h2 class="section-title" id="cyber">// Cybersécurité</h2>
        <div class="grid">
            <div class="card">
                <h3>Analyse Fichier (VirusTotal)</h3>
